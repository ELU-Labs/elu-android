name: Publish to Maven Central

# Manual trigger. Checks out an exact trusted signed release tag, requires the CI
# run that the tag names to be green on that commit, rebuilds and rechecks the
# release, and uploads only dev.elu:elu-analytics to Maven Central. The upload is
# not released automatically: the deployment waits in the Central Portal until a
# maintainer clicks Publish. The procedure is in release/README.md.
#
# The protected environment provides ELU_RELEASE_SIGNING_PUBLIC_KEYS (public keys
# of the tag-signing key and of the Maven artifact-signing key) and the variable
# ELU_TRUSTED_RELEASE_SIGNING_FINGERPRINTS, plus the publication secrets
# MAVEN_CENTRAL_USERNAME / MAVEN_CENTRAL_PASSWORD (Central Portal user token) and
# SIGNING_KEY / SIGNING_KEY_PASSWORD (armored PGP secret key and passphrase).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact trusted signed semantic-version tag to publish
        required: true
        type: string
      dryRun:
        description: Run every release gate but skip the Maven Central upload
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

concurrency:
  group: maven-central-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: maven-central-reviewed
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Import trusted release signing keys
        env:
          ELU_RELEASE_SIGNING_PUBLIC_KEYS: ${{ secrets.ELU_RELEASE_SIGNING_PUBLIC_KEYS }}
        run: |
          if [[ -z "$ELU_RELEASE_SIGNING_PUBLIC_KEYS" ]]; then
            echo "::error::ELU_RELEASE_SIGNING_PUBLIC_KEYS is not configured in the protected environment"
            exit 1
          fi
          printf '%s\n' "$ELU_RELEASE_SIGNING_PUBLIC_KEYS" | gpg --batch --import
      # Nothing from the checkout runs before this step: a tag pointing at edited
      # verifier scripts must not be able to approve itself.
      - name: Verify the tag signature before running repository code
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          ELU_TRUSTED_RELEASE_SIGNING_FINGERPRINTS: ${{ vars.ELU_TRUSTED_RELEASE_SIGNING_FINGERPRINTS }}
        run: |
          if [[ "$(git cat-file -t "refs/tags/${RELEASE_TAG}")" != "tag" ]]; then
            echo "::error::${RELEASE_TAG} is not an annotated tag"
            exit 1
          fi
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")" ]]; then
            echo "::error::The checkout is not the commit tagged ${RELEASE_TAG}"
            exit 1
          fi
          signers=$(git -c gpg.format=openpgp verify-tag --raw "${RELEASE_TAG}" 2>&1 \
            | awk '/^\[GNUPG:\] VALIDSIG / { print $3; print $NF }' | tr '[:lower:]' '[:upper:]' || true)
          trusted=$(printf '%s' "$ELU_TRUSTED_RELEASE_SIGNING_FINGERPRINTS" | tr ',' ' ' | tr '[:lower:]' '[:upper:]')
          for signer in $signers; do
            for fingerprint in $trusted; do
              if [[ "$signer" == "$fingerprint" ]]; then
                echo "Tag ${RELEASE_TAG} is signed by trusted key ${fingerprint}"
                exit 0
              fi
            done
          done
          echo "::error::${RELEASE_TAG} has no valid signature from a trusted release key"
          exit 1
      - name: Require the artifact signing key in the keyring
        run: python3 scripts/verify-release-publication.py --check-keyring
      - name: Verify matching reviewed signed tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          ELU_TRUSTED_RELEASE_SIGNING_FINGERPRINTS: ${{ vars.ELU_TRUSTED_RELEASE_SIGNING_FINGERPRINTS }}
        run: python3 scripts/verify-release-tag.py "$RELEASE_TAG"
      - name: Require green CI on the tagged commit
        timeout-minutes: 10
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
          ELU_TRUSTED_RELEASE_SIGNING_FINGERPRINTS: ${{ vars.ELU_TRUSTED_RELEASE_SIGNING_FINGERPRINTS }}
        run: python3 scripts/verify-ci-run.py "$RELEASE_TAG"
      - name: Run release gates
        run: >-
          ./gradlew
          :elu-analytics:testDebugUnitTest
          :elu-analytics:lintRelease
          :elu-analytics:assembleRelease
          :elu-analytics-compose:assembleRelease
          :elu-analytics:assembleDebugAndroidTest
          :elu-analytics:generatePomFileForMavenPublication
          :elu-analytics:generateMetadataFileForMavenPublication
          :elu-analytics:sourceReleaseJar
          :elu-analytics:javaDocReleaseJar
          :elu-analytics:cyclonedxDirectBom
          :elu-analytics-compose:generatePomFileForMavenPublication
          :elu-analytics-compose:generateMetadataFileForMavenPublication
          :elu-analytics-compose:sourceReleaseJar
          :elu-analytics-compose:javaDocReleaseJar
          :elu-analytics-compose:cyclonedxDirectBom
          :sample:assembleDebug
          checkConformanceFixtures
          checkFeatureFlagBoundary
          checkZeroBrandScanner
          checkZeroBrandRatchet
          --stacktrace
      - name: Validate local distributions and clean coordinate consumers
        run: |
          python3 scripts/validate-compose-distribution.py
          ./gradlew -p fixtures/compose-consumer assembleDebug -PeluMetadataMode=module -Pandroid.useAndroidX=true --stacktrace
          ./gradlew -p fixtures/compose-consumer assembleDebug -PeluMetadataMode=pom -Pandroid.useAndroidX=true --stacktrace
          python3 scripts/validate-compose-distribution.py --verify-staged
      - name: Require the core AAR named in the signed tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          ELU_TRUSTED_RELEASE_SIGNING_FINGERPRINTS: ${{ vars.ELU_TRUSTED_RELEASE_SIGNING_FINGERPRINTS }}
        run: python3 scripts/verify-release-publication.py --tag "$RELEASE_TAG"
      - name: Generate resolved release dependency evidence
        run: |
          mkdir -p build/reports
          ./gradlew :elu-analytics:dependencies --configuration releaseRuntimeClasspath \
            > build/reports/release-runtime-classpath.txt
          ./gradlew :elu-analytics-compose:dependencies --configuration releaseRuntimeClasspath \
            > build/reports/compose-release-runtime-classpath.txt
      - name: Validate static network-parser smoke
        run: |
          python3 scripts/validate-network-parser-smoke.py scanner/fixtures/network-parser-smoke.json
          python3 scripts/zero-brand-gate.py --mode strict --skip-tree \
            --network parser-smoke=scanner/fixtures/network-parser-smoke.json
      - name: Verify public API and legal-only artifact gate
        run: |
          python3 scripts/check-api-snapshot.py elu-analytics/build/outputs/aar/elu-analytics-release.aar \
            --compose-aar elu-analytics-compose/build/outputs/aar/elu-analytics-compose-release.aar
          scanner_inputs=(
            --input aar=elu-analytics/build/outputs/aar/elu-analytics-release.aar
            --input publication=elu-analytics/build/publications/maven
            --input sources=elu-analytics/build/intermediates/source_jar/release/release-sources.jar
            --input javadoc=elu-analytics/build/intermediates/java_doc_jar/release/release-javadoc.jar
            --input dependencies=build/reports/release-runtime-classpath.txt
            --input compose-aar=elu-analytics-compose/build/outputs/aar/elu-analytics-compose-release.aar
            --input compose-publication=elu-analytics-compose/build/publications/maven
            --input compose-sources=elu-analytics-compose/build/intermediates/source_jar/release/release-sources.jar
            --input compose-javadoc=elu-analytics-compose/build/intermediates/java_doc_jar/release/release-javadoc.jar
            --input compose-dependencies=build/reports/compose-release-runtime-classpath.txt
          )
          sbom_index=0
          while IFS= read -r -d '' sbom; do
            scanner_inputs+=(--input "sbom-${sbom_index}=${sbom}")
            ((sbom_index += 1))
          done < <(
            find build elu-analytics/build elu-analytics-compose/build -type f \
              \( -iname '*sbom*' -o -iname 'bom.json' -o -iname 'bom.xml' \) \
              -print0
          )
          python3 scripts/zero-brand-gate.py --mode strict "${scanner_inputs[@]}"
      - name: Verify core-only publication task graph without execution
        run: bash scripts/check-publication-graph.sh
      - name: Upload to Maven Central for a manual Publish
        if: ${{ !inputs.dryRun }}
        run: ./gradlew stageCentralRelease --no-configuration-cache --no-parallel --stacktrace
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          ELU_TRUSTED_RELEASE_SIGNING_FINGERPRINTS: ${{ vars.ELU_TRUSTED_RELEASE_SIGNING_FINGERPRINTS }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
      - name: Release summary
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          DRY_RUN: ${{ inputs.dryRun }}
        run: |
          aar_sha256=$(sha256sum elu-analytics/build/outputs/aar/elu-analytics-release.aar | cut -d' ' -f1)
          {
            echo "### dev.elu:elu-analytics:${RELEASE_TAG}"
            echo
            echo "- Source commit: \`$(git rev-parse HEAD)\`"
            echo "- Core AAR SHA-256: \`${aar_sha256}\`"
            if [[ "$DRY_RUN" == "true" ]]; then
              echo "- Dry run: every gate passed; nothing was uploaded."
            else
              echo "- Uploaded, not released. Wait until the deployment at"
              echo "  https://central.sonatype.com/publishing/deployments shows **Validated**,"
              echo "  then click **Publish**, or **Drop** it (also if it shows **Failed**)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
