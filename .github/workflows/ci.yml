name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Android SDK checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test, build, and compile consumer fixtures
        run: >-
          ./gradlew
          :elu-analytics:testDebugUnitTest
          :elu-analytics:lintRelease
          :elu-analytics:assembleRelease
          :elu-analytics-compose:assembleRelease
          :elu-analytics:assembleDebugAndroidTest
          :elu-analytics:generatePomFileForMavenPublication
          :elu-analytics:generateMetadataFileForMavenPublication
          :elu-analytics:sourceReleaseJar
          :elu-analytics:javaDocReleaseJar
          :elu-analytics:cyclonedxDirectBom
          :elu-analytics-compose:generatePomFileForMavenPublication
          :elu-analytics-compose:generateMetadataFileForMavenPublication
          :elu-analytics-compose:sourceReleaseJar
          :elu-analytics-compose:javaDocReleaseJar
          :elu-analytics-compose:cyclonedxDirectBom
          :sample:assembleDebug
          checkConformanceFixtures
          checkFeatureFlagBoundary
          checkZeroBrandScanner
          checkZeroBrandRatchet
          --stacktrace
      - name: Validate local distributions and compile Maven-only consumers
        run: |
          python3 scripts/validate-compose-distribution.py
          ./gradlew -p fixtures/compose-consumer assembleDebug -PeluMetadataMode=module -Pandroid.useAndroidX=true --stacktrace
          ./gradlew -p fixtures/compose-consumer assembleDebug -PeluMetadataMode=pom -Pandroid.useAndroidX=true --stacktrace
          # Core consumers: R8 full-mode release (+ size baseline), the same app compiled against
          # android-34, an app on OkHttp 5.x, a Java-only app and, in its own build, a Kotlin 2.0 app.
          ./gradlew -p fixtures/core-consumers \
            :r8:assembleRelease :r8:bundleRelease :r8:verifyR8KeepRules \
            :r8-baseline:assembleRelease :r8-baseline:bundleRelease \
            :r8-compile34:assembleRelease :r8-compile34:verifyR8KeepRules \
            :okhttp5:verifyOkHttpResolution :okhttp5:verifyOkHttpLinkage :okhttp5:assembleRelease :okhttp5:verifyR8KeepRules \
            :java:assembleDebug \
            --stacktrace
          ./gradlew -p fixtures/core-consumers -PeluMetadataMode=pom :okhttp5:verifyOkHttpResolution --stacktrace
          ./gradlew -p fixtures/kotlin20-consumer assembleDebug --stacktrace
          python3 scripts/measure-consumer-size.py \
            --baseline-apk fixtures/core-consumers/r8-baseline/build/module/outputs/apk/release/r8-baseline-release.apk \
            --baseline-aab fixtures/core-consumers/r8-baseline/build/module/outputs/bundle/release/r8-baseline-release.aab \
            --sdk-apk fixtures/core-consumers/r8/build/module/outputs/apk/release/r8-release.apk \
            --sdk-aab fixtures/core-consumers/r8/build/module/outputs/bundle/release/r8-release.aab \
            --sdk-mapping fixtures/core-consumers/r8/build/module/outputs/mapping/release/mapping.txt \
            --output-json build/reports/consumer-size.json \
            --output-markdown build/reports/consumer-size.md
          cat build/reports/consumer-size.md >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/validate-compose-distribution.py --verify-staged
      - name: Record the core AAR digest for a release tag
        run: |
          aar_sha256=$(sha256sum elu-analytics/build/outputs/aar/elu-analytics-release.aar | cut -d' ' -f1)
          echo "Core-AAR-SHA256: ${aar_sha256}"
          {
            echo "### dev.elu:elu-analytics release AAR"
            echo
            echo "Core-AAR-SHA256: \`${aar_sha256}\` (commit \`${GITHUB_SHA}\`, run ${GITHUB_RUN_ID})"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Verify public API and ABI snapshot
        run: >-
          python3 scripts/check-api-snapshot.py
          elu-analytics/build/outputs/aar/elu-analytics-release.aar
          --compose-aar elu-analytics-compose/build/outputs/aar/elu-analytics-compose-release.aar
      - name: Verify core-only publication task graph without execution
        run: bash scripts/check-publication-graph.sh
      - name: Compile immutable historical 0.1.0 consumer (no state-import claim)
        run: >-
          ./gradlew
          :sample:assembleDebug
          :sample:verifyBaselineArtifact
          -PeluBaselineVersion=0.1.0
          --stacktrace
      - name: Inventory dependency and artifact debt
        shell: bash
        run: |
          mkdir -p build/reports
          ./gradlew :elu-analytics:dependencies --configuration releaseRuntimeClasspath > build/reports/release-runtime-classpath.txt
          ./gradlew :elu-analytics-compose:dependencies --configuration releaseRuntimeClasspath > build/reports/compose-release-runtime-classpath.txt
          python3 scripts/validate-network-parser-smoke.py scanner/fixtures/network-parser-smoke.json
          python3 scripts/zero-brand-gate.py --mode report --skip-tree \
            --input aar=elu-analytics/build/outputs/aar/elu-analytics-release.aar \
            --input publication=elu-analytics/build/publications/maven \
            --input sources=elu-analytics/build/intermediates/source_jar/release/release-sources.jar \
            --input javadoc=elu-analytics/build/intermediates/java_doc_jar/release/release-javadoc.jar \
            --input dependencies=build/reports/release-runtime-classpath.txt \
            --input sbom=elu-analytics/build/reports/sbom/elu-analytics-release-sbom.json \
            --input compose-aar=elu-analytics-compose/build/outputs/aar/elu-analytics-compose-release.aar \
            --input compose-publication=elu-analytics-compose/build/publications/maven \
            --input compose-sources=elu-analytics-compose/build/intermediates/source_jar/release/release-sources.jar \
            --input compose-javadoc=elu-analytics-compose/build/intermediates/java_doc_jar/release/release-javadoc.jar \
            --input compose-dependencies=build/reports/compose-release-runtime-classpath.txt \
            --input compose-sbom=elu-analytics-compose/build/reports/sbom/elu-analytics-compose-release-sbom.json \
            | tee build/reports/zero-brand-artifacts.txt
          python3 scripts/zero-brand-gate.py --mode strict --skip-tree \
            --network parser-smoke=scanner/fixtures/network-parser-smoke.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-sdk-reports
          path: |
            elu-analytics/build/reports/tests/
            elu-analytics/build/outputs/aar/elu-analytics-release.aar
            elu-analytics-compose/build/outputs/aar/elu-analytics-compose-release.aar
            elu-analytics/build/publications/maven/
            elu-analytics/build/reports/sbom/
            elu-analytics-compose/build/publications/maven/
            elu-analytics-compose/build/reports/sbom/
            build/compose-distribution/
            fixtures/compose-consumer/build/module/reports/
            fixtures/compose-consumer/build/pom/reports/
            fixtures/core-consumers/*/build/*/reports/
            fixtures/core-consumers/r8/build/module/outputs/mapping/release/configuration.txt
            fixtures/kotlin20-consumer/build/reports/
            build/reports/

  owned-runtime:
    name: Android owned runtime instrumentation (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        # 23 is the minimum supported level (analytics only; replay needs 29+), 36 the
        # compile/target level. API 23 uses the x86 image the emulator action itself tests.
        # Every level runs at density 160 so dp sizes in the tests stay pixel sizes. 320x640
        # is the avdmanager default. API 36 also runs the full-HD replay tests
        # (@SdkSuppress(minSdkVersion = 36)), which need a window above the 1,048,576-pixel
        # image cap, so it gets 1080x1920.
        include:
          - api-level: 23
            arch: x86
            display: 320x640
          - api-level: 29
            arch: x86_64
            display: 320x640
          - api-level: 35
            arch: x86_64
            display: 320x640
          - api-level: 36
            arch: x86_64
            display: 1080x1920
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the staged distribution and optimized consumer smoke apps
        run: |
          ./gradlew \
            :elu-analytics:assembleRelease :elu-analytics-compose:assembleRelease \
            :elu-analytics:generatePomFileForMavenPublication :elu-analytics:generateMetadataFileForMavenPublication \
            :elu-analytics:sourceReleaseJar :elu-analytics:javaDocReleaseJar :elu-analytics:cyclonedxDirectBom \
            :elu-analytics-compose:generatePomFileForMavenPublication :elu-analytics-compose:generateMetadataFileForMavenPublication \
            :elu-analytics-compose:sourceReleaseJar :elu-analytics-compose:javaDocReleaseJar :elu-analytics-compose:cyclonedxDirectBom \
            --stacktrace
          python3 scripts/validate-compose-distribution.py
          ./gradlew -p fixtures/core-consumers :r8:assembleRelease :r8-compile34:assembleRelease :okhttp5:assembleRelease --stacktrace
      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify clean setup, owned SQLite continuity, refusal and privacy
        uses: reactivecircus/android-emulator-runner@v2
        env:
          AVD_DISPLAY: ${{ matrix.display }}
          AVD_DENSITY: '160'
        with:
          api-level: ${{ matrix.api-level }}
          arch: ${{ matrix.arch }}
          disable-animations: true
          pre-emulator-launch-script: |
            bash scripts/set-avd-display.sh "${ANDROID_AVD_HOME:-$HOME/.android/avd}/test.avd/config.ini" "$AVD_DISPLAY" "$AVD_DENSITY"
          script: |
            adb shell getprop ro.build.fingerprint
            adb shell getprop ro.build.version.sdk
            adb shell getprop ro.product.cpu.abi
            test "$(adb shell getprop ro.build.version.sdk | tr -d '\r')" = "${{ matrix.api-level }}"
            test "$(adb shell getprop ro.product.cpu.abi | tr -d '\r')" = "${{ matrix.arch }}"
            mkdir -p elu-analytics/build/reports
            adb shell 'for key in ro.build.version.sdk ro.product.cpu.abi dalvik.vm.heapgrowthlimit dalvik.vm.heapsize dalvik.vm.heapstartsize ro.config.low_ram ro.sf.lcd_density; do printf "%s=" "$key"; getprop "$key"; done' | tee elu-analytics/build/reports/device-memory.txt
            adb shell wm size | tee -a elu-analytics/build/reports/device-memory.txt
            adb shell wm density | tee -a elu-analytics/build/reports/device-memory.txt
            if [ -r "${ANDROID_AVD_HOME:-$HOME/.android/avd}/test.avd/config.ini" ]; then awk -F '[[:space:]]*=[[:space:]]*' '$1 ~ /^(hw\.ramSize|vm\.heapSize|hw\.lcd\.width|hw\.lcd\.height|hw\.lcd\.density|hw\.cpu\.ncore)$/ { print }' "${ANDROID_AVD_HOME:-$HOME/.android/avd}/test.avd/config.ini" | tee -a elu-analytics/build/reports/device-memory.txt; else echo 'avd_config_available=0' | tee -a elu-analytics/build/reports/device-memory.txt; fi
            test "$(adb shell wm size | tr -d '\r')" = "Physical size: $AVD_DISPLAY"
            test "$(adb shell wm density | tr -d '\r')" = "Physical density: $AVD_DENSITY"
            ./gradlew :elu-analytics:connectedDebugAndroidTest --stacktrace
            bash scripts/run-consumer-smoke.sh fixtures/core-consumers/r8/build/module/outputs/apk/release/r8-release.apk dev.elu.fixture.r8
            bash scripts/run-consumer-smoke.sh fixtures/core-consumers/okhttp5/build/module/outputs/apk/release/okhttp5-release.apk dev.elu.fixture.okhttp5
            bash scripts/run-consumer-smoke.sh fixtures/core-consumers/r8-compile34/build/module/outputs/apk/release/r8-compile34-release.apk dev.elu.fixture.r8compile34
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-owned-runtime-instrumentation-api-${{ matrix.api-level }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            elu-analytics/build/reports/androidTests/
            elu-analytics/build/outputs/androidTest-results/
            elu-analytics/build/reports/device-memory.txt
